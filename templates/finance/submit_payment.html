{% extends 'base.html' %}
{% block title %}Upload Payment Receipt - BYDEF MIS{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="mb-0 fw-bold">Upload Payment Receipt</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{% url 'submit_payment' %}" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Payment Category Dropdown -->
                        <div class="mb-3">
                            <label for="category" class="form-label fw-semibold">Payment Category</label>
                            <select name="category" id="category" class="form-select" required>
                                <option value="" disabled selected>Select Category</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% empty %}
                                    <option value="">Weekly Contribution</option>
                                    <option value="">Emergency Contribution</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Amount Paid Field -->
                        <div class="mb-3">
                            <label for="amount" class="form-label fw-semibold">Amount Paid (NGN)</label>
                            <input type="number" step="0.01" name="amount" id="amount" class="form-control" placeholder="e.g. 5000.00" required>
                        </div>

                        <!-- Transaction Reference Number Field -->
                        <div class="mb-3">
                            <label for="transaction_reference" class="form-label fw-semibold">Transaction Reference Number</label>
                            <input type="text" name="transaction_reference" id="transaction_reference" class="form-control" placeholder="Optional reference code">
                        </div>

                        <!-- Proof of Payment File Attachment Field -->
                        <div class="mb-3">
                            <label for="proof_of_payment" class="form-label fw-semibold">Proof of Payment File (Image/PDF)</label>
                            <input type="file" name="proof_of_payment" id="proof_of_payment" class="form-control" accept="image/*,.pdf" required>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success py-2 fw-semibold">Submit for Verification</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
